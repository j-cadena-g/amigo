packages:
  - "apps/*"
  - "packages/*"

overrides:
  esbuild: ">=0.25.0"

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - eslint@10.6.0

peerDependencyRules:
  allowedVersions:
    eslint-plugin-react>eslint: "10"
    eslint-plugin-react-hooks>eslint: "10"
