name: CI

on:
  # Backup trigger: pull_request synchronize is occasionally dropped; push always
  # fires for branch updates and keeps required checks from going missing on PRs.
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Key by branch + event so a same-repo pull_request (jobs skipped) cannot
  # cancel the push run that actually executes CI. For pull_request, include
  # the PR number so forked PRs sharing a branch name do not cancel each other.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.head_ref || github.ref_name) }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

# CI only. Deployments require either Cloudflare Workers Builds to be configured
# for this repo/branch or a separate deploy workflow.

jobs:
  lint-and-typecheck:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typegen
      - run: pnpm run db:migrate:local
      - run: pnpm run test
